global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: product-search-engine
    metrics_path: /actuator/prometheus
    static_configs:
      # When the `app` compose profile is enabled.
      - targets: ["app:8086"]
        labels:
          instance: compose-app
      # When the application runs on the host via `mvn spring-boot:run`.
      - targets: ["host.docker.internal:8086"]
        labels:
          instance: host-app
