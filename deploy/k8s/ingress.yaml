apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pse-app
  namespace: product-search-engine
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - search.example.com
      secretName: pse-tls
  rules:
    - host: search.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pse-app
                port:
                  name: http
